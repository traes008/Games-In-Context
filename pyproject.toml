[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "game-theoretic-benchmark"
version = "0.1.0"
description = "Framework for evaluating LLM decision-making in game-theoretic scenarios"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "langchain-anthropic>=1.2.0",
    "langchain-core>=1.1.0",
    "langchain-google-genai>=3.2.0",
    "langchain-huggingface>=1.1.0",
    "langchain-ollama>=1.0.0",
    "langchain-openai>=1.1.0",
    "langgraph>=1.0.4",
    "matplotlib>=3.10.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "seaborn>=0.13.0",
    "python-dotenv>=1.0.0",
    "scipy>=1.15.3",
    "statsmodels>=0.14.0",
    "wordcloud>=1.9.6",
]

[tool.setuptools]
packages = ["src"]
